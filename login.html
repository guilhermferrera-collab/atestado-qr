<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login Admin</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

  <div class="topo">
    <img src="/lab.jpg.png" class="logo">
    <h1>Login Administrativo</h1>
    <p class="texto">Digite a senha para acessar o painel.</p>
  </div>

  <div class="card dados">

    <form action="/entrar" method="POST">

      <p>Senha</p>
      <input name="senha" type="password" required>

      <br><br>

      <button type="submit">
        Entrar
      </button>

    </form>

  </div>

</div>

</body>
</html>
